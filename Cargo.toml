[package]
name = "taiko-01-protocol-demo"
version = "0.1.0"
edition = "2021"
description = "0/1 protocol demos for Taiko: deterministic preconfirmations (zero-alloc execution gates) + capability-gated agent runtime with an integrity notary"
license = "MIT"

[dependencies]
blake3 = "1"
ed25519-dalek = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
